<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cavity flow · Flow Lab</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script type="module" src="/viewer.js"></script></head>
<body><header><div class="brand"><span aria-hidden="true">≋</span> Flow Lab</div><span>Fluid dynamics</span></header>
<main><h1>Cavity flow</h1><p class="intro">Watch a jet enter a closed-wall cavity and turn back on itself.</p>
<div class="layout"><section class="plate" aria-label="Simulation"><div class="plate-head"><h2>Velocity field</h2><span id="status" role="status">At rest</span></div>
<svg id="field" viewBox="-52 -20 692 457" role="img" aria-label="Cavity velocity field">
<defs><pattern id="dots" width="25" height="25" x="12.5" y="12.5" patternUnits="userSpaceOnUse"><circle r="1.25" fill="#6c8993"/></pattern><clipPath id="inside"><rect width="600" height="400"/></clipPath></defs>
<rect width="600" height="400" fill="url(#dots)" stroke="#aec1c6" stroke-width="2"/>
<g id="axes"></g><path class="velocity" d="" clip-path="url(#inside)" fill="none" stroke="#d6f5ed" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
<g id="ports"></g></svg>
<div class="legend"><span class="in">Inlet</span><span class="out">Outlet</span><span class="wall">Solid wall</span></div></section>
<aside><section><h2>Playback</h2><div class="time"><span>Simulation time</span><strong id="time">0.00 s</strong></div><div class="controls"><button id="run" type="button">Run</button><button id="restart" type="button" disabled>Restart</button></div></section>
<section><h2>Flow conditions</h2><dl id="conditions"></dl></section></aside></div></main></body></html>
